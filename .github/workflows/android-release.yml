# =============================================================================
# Msaidizi CFO — Android Release APK Build
# Builds a signed release APK on every push to main or version tag
# =============================================================================

name: Android Release

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: github.event_name != 'pull_request'
        working-directory: android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
            echo "✅ Keystore decoded"
          else
            echo "::warning::No KEYSTORE_BASE64 secret — building unsigned APK"
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        working-directory: android
        run: |
          # Show environment for debugging
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms found"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools found"
          
          # Install required SDK components
          sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
          
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "🔐 Building signed release APK..."
            gradle assembleRelease \
              -PKEYSTORE_FILE=app/release.keystore \
              -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
              -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
              -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
              --no-daemon --stacktrace --info 2>&1 | tail -100
          else
            echo "📦 Building unsigned release APK..."
            gradle assembleRelease --no-daemon --stacktrace --info 2>&1 | tail -100
          fi

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in build output"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          VERSION=$(grep versionName android/app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Found APK: $APK_PATH (v$VERSION)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Msaidizi-CFO-v${{ steps.find_apk.outputs.version }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 90

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release.keystore
