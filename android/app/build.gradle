plugins {
    id 'com.android.application'
}

android {
    namespace 'com.angavu.msaidizi'
    compileSdk 34

    defaultConfig {
        applicationId "com.angavu.msaidizi"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def ksFile = findProperty('KEYSTORE_FILE') ?: System.getenv('KEYSTORE_FILE')
            def ksPass = findProperty('KEYSTORE_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            def keyAlias = findProperty('KEY_ALIAS') ?: System.getenv('KEY_ALIAS')
            def keyPass = findProperty('KEY_PASSWORD') ?: System.getenv('KEY_PASSWORD')

            if (ksFile && ksPass && keyAlias && keyPass) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias keyAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.browser:browser:1.7.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
