# =============================================================================
# Msaidizi CFO — Android Release APK Build
# =============================================================================

name: Android Release

"on":
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          VERSION=$(grep versionName android/app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ APK: $APK_PATH (v$VERSION)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Msaidizi-CFO-v${{ steps.find_apk.outputs.version }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
          name: "Msaidizi CFO v${{ steps.find_apk.outputs.version }}"
          body: |
            ## Msaidizi CFO — Msaidizi wa Biashara ya AI
            
            ### Pakua
            - Bonyeza `msaidizi-v${{ steps.find_apk.outputs.version }}.apk` hapo chini kupakua
            - Sanikisha kwenye simu yako (Android 8.0+)
            
            ### Sifa
            - 🎤 Sauti kwanza — Kiswahili, Sheng, lugha 15+
            - 📱 Bila intaneti — inafanya kazi popote
            - 📊 CFO wa AI — taarifa za kila siku
            - 🔒 Faragha — data yako iko kwenye simu yako
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
