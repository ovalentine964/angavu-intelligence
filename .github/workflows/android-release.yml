# =============================================================================
# Msaidizi CFO — Android Release APK Build
# Builds a signed release APK on every push to main or version tag
# =============================================================================

name: Android Release

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV

      - name: Build Release APK
        working-directory: android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Building signed release APK..."
            ./gradlew assembleRelease \
              -PKEYSTORE_FILE=release.keystore \
              -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
              -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
              -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          else
            echo "::warning::No signing keystore configured. Building unsigned release APK."
            echo "To sign: add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD to repo secrets."
            ./gradlew assembleRelease
          fi

      - name: Build Debug APK (always available)
        if: failure()
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          if [ -f app-release.apk ]; then
            VERSION=$(grep versionName ../../../../../app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
            cp app-release.apk "Msaidizi-CFO-v${VERSION}.apk"
            echo "APK_NAME=Msaidizi-CFO-v${VERSION}.apk" >> $GITHUB_ENV
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Msaidizi-CFO-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release.keystore
