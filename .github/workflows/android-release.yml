name: Android Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Find APK
        id: ap
        run: |
          P=$(find android/app/build/outputs -name "*.apk" | head -1)
          V=$(grep versionName android/app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "path=$P" >> $GITHUB_OUTPUT
          echo "ver=$V" >> $GITHUB_OUTPUT
          echo "APK=$P v$V"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Msaidizi-CFO-${{ steps.ap.outputs.ver }}
          path: ${{ steps.ap.outputs.path }}
          retention-days: 90

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.ap.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
