# =============================================================================
# Msaidizi CFO — Android Release APK Build
# Builds a signed release APK on every push to main or version tag
# =============================================================================

name: Android Release

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
          echo "✅ SDK components installed"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: github.event_name != 'pull_request'
        working-directory: android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "::warning::No KEYSTORE_BASE64 secret — building debug-signed APK"
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Build APK
        id: build
        working-directory: android
        run: |
          echo "=== Environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          gradle --version | head -5
          
          echo ""
          echo "=== Building APK ==="
          if [ "$HAS_KEYSTORE" = "true" ]; then
            gradle assembleRelease \
              -PKEYSTORE_FILE=app/release.keystore \
              -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
              -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
              -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
              --no-daemon 2>&1
          else
            gradle assembleRelease --no-daemon 2>&1
          fi
          BUILD_EXIT=$?
          echo ""
          echo "=== Build exit code: $BUILD_EXIT ==="
          
          # List all outputs
          echo "=== Build outputs ==="
          find app/build/outputs -type f 2>/dev/null || echo "No outputs directory"
          
          # Find APK
          APK_PATH=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "✅ APK found: $APK_PATH"
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            ls -lh "$APK_PATH"
          else
            echo "❌ No APK found"
            # Try building debug as fallback
            echo "Attempting debug build..."
            gradle assembleDebug --no-daemon 2>&1 | tail -20
            APK_PATH=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
            if [ -n "$APK_PATH" ]; then
              echo "✅ Debug APK found: $APK_PATH"
              echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            else
              echo "::error::No APK produced by either release or debug build"
              exit 1
            fi
          fi

      - name: Get version
        id: version
        run: |
          VERSION=$(grep versionName android/app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Msaidizi-CFO-v${{ steps.version.outputs.version }}
          path: ${{ steps.build.outputs.apk_path }}
          retention-days: 90

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.build.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release.keystore
