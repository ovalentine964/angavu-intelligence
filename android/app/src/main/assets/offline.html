<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Msaidizi — Hakuna Intaneti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d2b3e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .icon { font-size: 4rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #E8A838; }
        p { font-size: 1.1rem; color: #a0b4c0; line-height: 1.6; max-width: 360px; }
        .retry-btn {
            margin-top: 2rem;
            padding: 1rem 2.5rem;
            background: #E8A838;
            color: #0d2b3e;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .retry-btn:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>Hakuna Intaneti</h1>
    <p>Hakuna muunganisho wa intaneti. Tafadhali angalia muunganisho wako na ujaribu tena.</p>
    <p style="margin-top:0.5rem;font-size:0.9rem;color:#7a8a94;">No internet connection. Please check and try again.</p>
    <button class="retry-btn" onclick="location.reload()">🔄 Jaribu Tena</button>
</body>
</html>
